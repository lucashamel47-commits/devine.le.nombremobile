<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    text-align: center;
    background: #111;
    color: white;
    font-family: sans-serif;
  }
  button {
    font-size: 22px;
    padding: 12px 24px;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 12px;
    margin: 12px;
    transition: transform 0.1s;
  }
  button:active {
    transform: scale(0.95);
  }
  input {
    font-size: 22px;
    padding: 8px;
    width: 80px;
    margin: 12px;
  }
  h1, #out, #reste, #hist, #record {
    margin: 12px;
  }
  #out {
    font-size: 20px;
    min-height: 40px;
  }
</style>

<h1>Devine le nombre</h1>
<p>Entre 1 et 10</p>
<select id="niveau">
  <option value="facile">Facile</option>
  <option value="moyen">Moyen</option>
  <option value="difficile">Difficile</option>
</select>
<form id="f">
  <input id="n" type="number" min="1" max="10" placeholder="?" />
  <button id="btn" type="submit">Valider</button>
</form>
<button id="rejouer">Nouvelle partie</button>
<p id="out"></p>
<p id="reste">5 essais</p>
<p id="hist">Essais : </p>
<p id="record"></p>

<script>
  let max = 10;
  let maxEssais = 5;
  let SECRET = Math.floor(Math.random() * max) + 1;
  let essais = 0;
  let fini = false;
  let record = localStorage.getItem("record");
  if (record) document.getElementById("record").textContent = "record : " + record;

  function comparer(essai, secret) {
    if (essai < secret) return "plus";
    if (essai > secret) return "moins";
    return "gagné";
  }

  function jouer(essai) {
    return comparer(essai, SECRET);
  }

  function message(essai) {
    if (fini) return "Le jeu est fini";
    essais = essais + 1;
    document.getElementById("reste").textContent = (maxEssais - essais) + " restant(s)";
    if (essais > maxEssais) {
      fini = true;
      return "Tu pue le caca";
    }
    const r = jouer(essai);
    if (r === "plus") return "T'en fais expres c'est plus (" + essais + ")";
    if (r === "moins") return "A oe le niveau c'est moins (" + essais + ")";
    fini = true;
    if (record === null || Number(record) === 0 || essais < Number(record)) {
      record = String(essais);
      localStorage.setItem("record", record);
      document.getElementById("record").textContent = "record : " + record;
    }
    return "Suuuuui en " + essais + " essai(s)";
  }

  function niveau(m, e, nom) {
    max = m;
    maxEssais = e;
    SECRET = Math.floor(Math.random() * max) + 1;
    essais = 0;
    fini = false;
    document.getElementById("n").max = max;
    document.getElementById("out").textContent = nom;
    document.getElementById("reste").textContent = maxEssais + " essais";
    document.getElementById("hist").textContent = "Essais : ";
    document.getElementById("btn").disabled = false;
    document.getElementById("out").style.color = "white";
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    if (document.getElementById("n").value === "") return;
    const essai = Number(document.getElementById("n").value);
    if (essai < 1 || essai > max) return;
    document.getElementById("out").textContent = message(essai);
    document.getElementById("hist").textContent += essai + " ";
    document.getElementById("n").value = "";
    document.getElementById("n").focus();
    if (fini) {
      document.getElementById("reste").textContent = "secret = " + SECRET;
      document.getElementById("out").style.color = essais > maxEssais ? "#e74c3c" : "#2ecc71";
      document.getElementById("btn").disabled = true;
    }
  });

  document.getElementById("rejouer").addEventListener("click", function () {
    SECRET = Math.floor(Math.random() * max) + 1;
    essais = 0;
    fini = false;
    document.getElementById("out").textContent = "Nouvelle partie";
    document.getElementById("out").style.color = "white";
    document.getElementById("n").value = "";
    document.getElementById("reste").textContent = maxEssais + " essais";
    document.getElementById("hist").textContent = "Essais : ";
    document.getElementById("btn").disabled = false;
    if (record) document.getElementById("record").textContent = "record : " + record;
  });
document.getElementById("niveau").addEventListener("change", function () {
  const v = document.getElementById("niveau").value;
  if (v === "facile") niveau(10, 5, "Facile : 1 à 10");
  if (v === "moyen") niveau(20, 7, "Moyen : 1 à 20");
  if (v === "difficile") niveau(50, 10, "Difficile : 1 à 50");
  });
</script>
